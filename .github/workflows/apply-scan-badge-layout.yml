name: Apply scan badge layout fix

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fix-scan-badge-layout.mjs'
      - '.github/workflows/apply-scan-badge-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout patch
        run: node scripts/fix-scan-badge-layout.mjs

      - name: Commit layout change
        run: |
          if git diff --quiet; then
            echo "No layout changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PlcWorkbench.tsx
          git commit -m "fix: keep scan badge compact on mobile"
          git push
