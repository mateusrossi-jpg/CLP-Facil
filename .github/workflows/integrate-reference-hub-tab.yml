name: Integrate reference hub tab

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/integrate-reference-hub-tab.mjs'
      - '.github/workflows/integrate-reference-hub-tab.yml'
      - 'src/components/ReferenceHubPanel.tsx'
      - 'src/components/BottomNavigation.tsx'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate reference hub tab
        run: node scripts/integrate-reference-hub-tab.mjs

      - name: Commit reference hub tab integration
        run: |
          if git diff --quiet; then
            echo "No reference hub changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "feat: move PLC and protocol reference to own tab"
          git push
