name: Compact hardware export panel

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/compact-hardware-export-panel.mjs'
      - '.github/workflows/compact-hardware-export-panel.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compact hardware panel
        run: node scripts/compact-hardware-export-panel.mjs

      - name: Commit compact hardware panel
        run: |
          if git diff --quiet; then
            echo "No hardware panel changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HardwareExportPanel.tsx
          git commit -m "fix: split hardware export into focused steps"
          git push
