name: Integrate hardware export panel

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/integrate-hardware-export-panel.mjs'
      - '.github/workflows/integrate-hardware-export-panel.yml'
      - 'src/components/HardwareExportPanel.tsx'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate panel
        run: node scripts/integrate-hardware-export-panel.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "feat: show hardware export panel in simulator"
          git push
