name: Enhance smartphone I/O education

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/enhance-smartphone-io-education.mjs'
      - '.github/workflows/enhance-smartphone-io-education.yml'
      - 'src/simulation/smartphoneIoView.ts'
      - 'src/simulation/smartphoneIoViewRegression.ts'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enhance smartphone I/O education
        run: node scripts/enhance-smartphone-io-education.mjs

      - name: Commit smartphone I/O education enhancement
        run: |
          if git diff --quiet; then
            echo "No smartphone I/O education changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SmartphoneSimulationPanel.tsx
          git commit -m "feat: explain mobile I/O groups"
          git push
