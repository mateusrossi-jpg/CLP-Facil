name: Integrate PLC profile panel

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/integrate-plc-profile-panel.mjs'
      - '.github/workflows/integrate-plc-profile-panel.yml'
      - 'src/components/PlcProfilePanel.tsx'
      - 'src/plcProfiles/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate PLC profile panel
        run: node scripts/integrate-plc-profile-panel.mjs

      - name: Commit PLC profile panel integration
        run: |
          if git diff --quiet; then
            echo "No PLC profile integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "feat: show PLC profile comparison in simulator"
          git push
