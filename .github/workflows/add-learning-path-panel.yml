name: Add learning path panel

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/add-learning-path-panel.mjs'
      - '.github/workflows/add-learning-path-panel.yml'
      - 'src/components/LearningPathPanel.tsx'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add learning path panel
        run: node scripts/add-learning-path-panel.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No learning path changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "feat: show guided learning path on home"
          git push
