name: Smartphone simulation panel

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate-smartphone-simulation-panel.mjs'
      - 'src/components/SmartphoneSimulationPanel.tsx'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/integrate-smartphone-simulation-panel.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "feat: show smartphone simulation compact mode"
          git push
